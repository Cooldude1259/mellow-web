<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing you in… · Mellow</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#161a22}
    .card{background:#fff;border-radius:16px;padding:32px 34px;max-width:360px;text-align:center;
      box-shadow:0 6px 24px rgba(20,24,40,.08)}
    .logo{font-size:26px;font-weight:800;margin-bottom:10px}
    .msg{color:#5b6472;font-size:14px;line-height:1.5}
    .spin{width:26px;height:26px;margin:14px auto 0;border:3px solid #eee;border-top-color:#ff5a5f;
      border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a.btn{display:inline-block;margin-top:16px;padding:11px 22px;background:#ff5a5f;color:#fff;
      text-decoration:none;border-radius:10px;font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Mellow 🔥</div>
    <div class="msg" id="msg">Signing you in to support…</div>
    <div class="spin" id="spin"></div>
    <div id="action"></div>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL = 'https://bmfbnydcanksjwquljzb.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qa7veCIyFBL1_BYNFOCsXQ_cfHGKyh0';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      db: { schema: 'social-media-public' },
      auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true },
    });

    const msg = document.getElementById('msg');
    const spin = document.getElementById('spin');
    const action = document.getElementById('action');
    // Featurebase appends return_to when it bounces the user here.
    const returnTo = new URLSearchParams(location.search).get('return_to') || '';

    function fail(text) {
      spin.remove();
      msg.textContent = text;
      // Send them into the app to sign in, then they can retry support.
      action.innerHTML = '<a class="btn" href="../index.html">Sign in to Mellow</a>';
    }

    (async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return fail('Please sign in to Mellow first, then reopen support.');

        const { data, error } = await supabase.functions.invoke('featurebase-sso', {
          body: { return_to: returnTo },
        });
        if (error || !data?.redirect) throw new Error(error?.message || 'no redirect');
        location.href = data.redirect;
      } catch (e) {
        console.error('featurebase sso', e);
        fail('Something went wrong signing you in to support.');
      }
    })();
  </script>
</body>
</html>
