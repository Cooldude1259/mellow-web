<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authorize · Mellow</title>
  <style>
    :root{--primary:#ff5a5f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#161a22}
    .card{background:#fff;border-radius:18px;padding:30px 32px;max-width:400px;width:calc(100% - 32px);
      box-shadow:0 8px 30px rgba(20,24,40,.10)}
    .logo{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px}
    h1{font-size:18px;margin:14px 0 6px;text-align:center}
    .sub{color:#5b6472;font-size:14px;line-height:1.5;text-align:center;margin:0 0 18px}
    .app{font-weight:700}
    .scopes{background:#f7f8fa;border:1px solid #eef0f3;border-radius:12px;padding:12px 14px;margin:0 0 18px}
    .scopes h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#8a92a1;margin:0 0 8px}
    .scopes ul{margin:0;padding-left:18px}
    .scopes li{font-size:14px;color:#3a414d;margin:3px 0}
    .who{font-size:12.5px;color:#8a92a1;text-align:center;margin:0 0 18px}
    .row{display:flex;gap:10px}
    button{flex:1;padding:12px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid transparent}
    .allow{background:var(--primary);color:#fff}
    .deny{background:#fff;color:#3a414d;border-color:#dfe3e8}
    button:disabled{opacity:.6;cursor:default}
    .spin{width:26px;height:26px;margin:8px auto;border:3px solid #eee;border-top-color:var(--primary);
      border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .err{color:#c02626;font-size:14px;text-align:center;line-height:1.5}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Mellow 🔥</div>
    <div id="loading">
      <div class="spin"></div>
      <p class="sub" id="loadingMsg">Checking your request…</p>
    </div>

    <div id="consent" class="hidden">
      <h1>Authorize access</h1>
      <p class="sub"><span class="app" id="appName">An app</span> wants to sign you in with your Mellow account.</p>
      <div class="scopes hidden" id="scopeBox">
        <h2>It will be able to</h2>
        <ul id="scopeList"></ul>
      </div>
      <p class="who" id="who"></p>
      <div class="row">
        <button class="deny" id="denyBtn">Deny</button>
        <button class="allow" id="allowBtn">Allow</button>
      </div>
    </div>

    <div id="error" class="hidden"><p class="err" id="errMsg"></p></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL = 'https://bmfbnydcanksjwquljzb.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qa7veCIyFBL1_BYNFOCsXQ_cfHGKyh0';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      db: { schema: 'social-media-public' },
      auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true },
    });

    const $ = (id) => document.getElementById(id);
    const show = (id) => $(id).classList.remove('hidden');
    const hide = (id) => $(id).classList.add('hidden');
    function fail(text) { hide('loading'); hide('consent'); $('errMsg').textContent = text; show('error'); }

    // Human-friendly labels for common OAuth scopes; unknown scopes show raw.
    const SCOPE_LABELS = {
      openid: 'Confirm your identity',
      email: 'See your email address',
      profile: 'See your basic profile',
      offline_access: 'Stay signed in',
    };

    const authId = new URLSearchParams(location.search).get('authorization_id');

    (async () => {
      if (!authId) return fail('This authorization link is missing information. Please start again from the app.');
      if (!supabase.auth.oauth) return fail('This browser build is out of date. Please refresh and try again.');

      // Must be signed in to Mellow. If not, sign in and return to this exact URL.
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        $('loadingMsg').textContent = 'Sending you to sign in…';
        await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href } });
        return;
      }

      // Fetch what the app is asking for (or an immediate redirect if already consented).
      const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authId);
      if (error) return fail(error.message || 'Could not load this authorization request.');
      if (data?.redirect_url) { location.href = data.redirect_url; return; } // already approved

      const client = data?.client || {};
      $('appName').textContent = client.name || client.client_name || 'An app';
      const scopes = Array.isArray(data?.scopes) ? data.scopes : [];
      if (scopes.length) {
        $('scopeList').innerHTML = scopes
          .map((s) => `<li>${SCOPE_LABELS[s] || s}</li>`).join('');
        show('scopeBox');
      }
      const handle = session.user?.user_metadata?.name || session.user?.email || '';
      if (handle) $('who').textContent = `Signed in as ${handle}`;

      hide('loading'); show('consent');

      $('allowBtn').addEventListener('click', () => decide('approve'));
      $('denyBtn').addEventListener('click', () => decide('deny'));
    })();

    async function decide(kind) {
      $('allowBtn').disabled = true; $('denyBtn').disabled = true;
      try {
        const fn = kind === 'approve'
          ? supabase.auth.oauth.approveAuthorization(authId)
          : supabase.auth.oauth.denyAuthorization(authId);
        const { data, error } = await fn;
        if (error || !data?.redirect_url) throw new Error(error?.message || 'No redirect from Supabase.');
        location.href = data.redirect_url;
      } catch (e) {
        console.error('oauth decide', e);
        $('allowBtn').disabled = false; $('denyBtn').disabled = false;
        fail('Something went wrong finishing authorization. Please try again.');
      }
    }
  </script>
</body>
</html>
